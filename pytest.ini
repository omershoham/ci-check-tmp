[pytest]
testpaths = tests
# The suite is offline and fast by design (fake LLM / broker / data). Tests that parse
# real cached SEC ZIPs are correct but cost 20-40s each and depend on what happens to be
# in data/cache, so they are opt-in:  python -m pytest -m slow
addopts = -m "not slow"
markers =
    slow: parses real cached FSDS quarterly ZIPs; run explicitly with -m slow

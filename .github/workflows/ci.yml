name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks out and tests; it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      # Rule set lives in ruff.toml: runtime breakage only (syntax, undefined names).
      - run: ruff check --output-format=github .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # README promises 3.11+; hold the floor on one OS.
          - os: ubuntu-latest
            python: "3.11"
    env:
      # The suite is offline by design (fake LLM/broker/data, temp DB and history store
      # per test — see tests/conftest.py) and needs no .env. These make sure nothing on
      # the runner can point it somewhere real: no workspace override, no credentials.
      CLAUDE_TRADER_HOME: ""
      ANTHROPIC_API_KEY: ""
      CLAUDE_CODE_OAUTH_TOKEN: ""
      OPENAI_API_KEY: ""
      # Windows runners default stdout to cp1252; the CLI output is full of emoji/arrows.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # LightGBM's macOS wheels link against OpenMP but do not bundle it.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install libomp

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

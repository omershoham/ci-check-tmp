# Claude Trader configuration
# Edit thresholds/weights here; no code changes needed for tuning.

paths:
  db: data/trader.db
  cache: data/cache

# Which theme pack in themes/ supplies the board's name, the actors named in the
# catalyst/research prompts, and (for `universe.source: curated`) the ticker lists.
# `general` is the theme-free default and what ships with `universe.source: broad`.
# The catalyst KEY SET is never theme-varying —
# it lives in src/local_llm.CATALYST_KEYS so signals stay poolable across themes.
theme: general

universe:
  # broad   = every US-listed SEC registrant that files financial statements, floored
  #           point-in-time by src/universe.py::investable(). THE SHIPPED DEFAULT since
  #           Phase 7. Needs the registrant table and candidate prices first:
  #             python -m scripts.data_refresh --registrants --shares-bulk --screen-prices
  # curated = the theme pack's hand-picked lists. Still fully supported; pair it with
  #           `theme: ai_infra`, which is the pack that owns those lists. A curated
  #           universe is chosen with hindsight, which is what its backtest disclosure
  #           line says out loud.
  source: broad
  broad:
    max_symbols: 1500            # the phasing knob: 250 -> 750 -> 1500 (shipped: 1500)
    rank_by: adv                 # which measure the cap keeps the top of
    exchanges: [Nasdaq, NYSE, NYSE American, Cboe]
    exclude_sic: [6726, 6770]    # funds/CEFs/BDCs, blank checks. REITs (6798) stay in
    min_history_days: 200        # closes required inside the screen window
    adv_window: 20               # sessions averaged for dollar volume
    screen_price_days: 400       # calendar-day price window the floor is computed on

  # Hard liquidity/size floor applied BEFORE scoring (Q&A: "standard floor")
  liquidity_floor:
    min_market_cap: 300000000      # $300M
    min_price: 5.0                 # $
    min_avg_dollar_volume: 5000000 # $5M average daily traded value

  # Curated universe (only when source: curated): see themes/ai_infra.yaml
  # (`subsectors:`), which owns both the ticker lists and their display labels. A
  # `universe.sectors:` block here still overrides the pack wholesale
  # (config._REPLACE_KEYS) if you want your own list.

screen:
  # Names handed to the serial, GPU-bound local-LLM signal stage. One 9-key catalyst
  # call costs ~9.5s warm, so this IS the stage's wall-clock: 100 names ~= 16 min per
  # run. Raising it costs no Claude/subscription usage (that is capped by
  # finalist_size), only GPU time on the box.
  shortlist_size: 100
  finalist_size: 10    # passed to Claude deep research (the cost cap)
  # At most this many finalists from any one GICS-like sector. The top 10 of a
  # 1,500-name board concentrate in whichever sector the composite currently favours
  # (broad-250 was 34% Information Technology), which turns claude_vs_screen from
  # "analyst vs screen" into "one sector vs the market". Set 0 to disable.
  # The cap yields rather than shrinking the cohort on a single-sector universe -
  # see pipeline.select_finalists.
  max_finalists_per_sector: 3
  earnings_soon_days: 7  # tag a name "earnings-soon" if it reports within this many days

# Where the screen-only (unresearched) buy/hold/avoid labels cut the board.
# QUANTILES of the run's own composite, never absolute score values: `blended` is a
# weighted mean of percentile ranks, so its spread shrinks as pillars are added
# (sd 0.167 with three, 0.130 with five) and a fixed 0.66 cut would quietly drop
# P(buy) from ~19% to ~11% the day a dark pillar is switched on, with no change in
# skill. These labels are DISPLAY ONLY - `performance._bucket` grades on
# research_reports.rating and claude_vs_screen's control cohort is the pipeline's
# finalist cut, so moving them invalidates no calibration statistic.
recommend:
  screen_buy_quantile: 0.90   # top 10% of the board -> provisional buy
  screen_hold_quantile: 0.60  # top 40% -> hold; below -> avoid

# Your investment policy — every stage (deep dives, PM reconcile, sizing hints, digest)
# optimizes against THESE numbers, not implicit defaults. Edit to taste.
policy:
  max_position_weight: 20        # % of portfolio; above this requires high conviction
  high_weight_min_conviction: 7  # conviction needed to keep a >max_position_weight position in full
  conviction_weight_caps:        # conviction -> max % weight (binding sizing rules)
    3: 10                        # conviction <=3 -> max 10% weight
    5: 15                        # conviction 4-5 -> max 15% weight
  # % of portfolio in one GICS-like SECTOR before it's flagged. The concentration a
  # stock picker actually accumulates is sectoral (six software names in three
  # different "sub-sectors" are one bet), and on the broad universe `subsector` carries
  # a ~28-way SIC industry group, which is too fine to bind. `max_subsector_weight` is
  # still honoured as an alias so an existing user config keeps working.
  max_sector_weight: 40
  max_subsector_weight: 40       # DEPRECATED alias of max_sector_weight
  min_ballast_weight: 10         # % target of non-AI-theme ballast the synthesis should aim for
  risk_per_position_pct: 1.0     # % of portfolio value risked per new position (sizing hint)
  vol_target_pct: 12             # realized book vol above this -> PM scales gross exposure down (never up)
  drawdown_tighten_pct: 10       # book this far below its 90d peak -> conviction caps tighten a further 25%
  # Non-AI diversifier candidates the portfolio stage may recommend (outside the screen universe).
  ballast_watchlist: [TLT, IEF, GLD, XLP, XLV, SCHD, VXUS]

# How past calls are graded (Accuracy tab, learning loop). Honest measurement rules:
# buy calls pay a round-trip cost; hold/screen-only are the do-nothing alternative.
evaluation:
  cost_bps: 30                   # round-trip spread+slippage charged to buy/strong_buy calls
  min_n_for_ci: 8                # calibration cells with fewer graded calls are flagged unreliable
  # Per-idea grading clocks, in TRADING days (same convention as performance._WINDOWS).
  # An idea is graded on the clock it CLAIMED: a swing call and a long call scored on
  # the same 4-week ruler are not being measured, they are being averaged.
  # The fixed 1w/4w/13w windows keep being computed alongside these, forever.
  horizons:
    swing: 10                    # ~2 weeks: a catalyst/setup that resolves fast
    position: 42                 # ~2 months: the default when neither extreme applies
    long: 126                    # ~6 months: a re-rating thesis, not a catalyst
  default_horizon: position      # used when nobody stated one

risk:
  benchmark: QQQ                 # portfolio beta reference
  theme_benchmark: SMH           # theme-shock proxy (defaults to technical.rs_benchmark if unset)

regime:
  enabled: true
  benchmark: SPY                 # regime anchor: price vs 200dma
  breadth_threshold_pct: 40      # universe breadth below this (% above 50dma) = stress

scoring:
  # Three-pillar composite ranking score (balanced; tune for your horizon).
  pillars:
    # Changed 2026-09-10 from technical 0.35 / fundamental 0.30, on a pre-registered
    # six-way comparison over broad-1500, 115 non-overlapping dates. Read the result
    # honestly: mean rank IC is STATISTICALLY IDENTICAL across every weighting tried
    # (paired per-date differences all |t| < 1), so this is NOT "the better ranker".
    # What is unambiguous is arithmetic: turnover 90.7% -> 61.6% per rebalance and cost
    # drag 1.60% -> 1.09%/yr. The technical pillar's contribution to the composite was
    # mostly churn. It keeps a real weight because removing it further worsens max
    # drawdown monotonically (-27.2% -> -33.4% at zero) -- it buys trend control it
    # does not buy ranking skill. Do not read the t-stat rise (2.52 -> 3.62) as skill:
    # it is variance reduction from down-weighting a noisy input.
    technical: 0.20    # RSI, MACD, SMA trend/crosses, 52w position, volume (src/technical.py)
    fundamental: 0.45  # valuation, cashflow, growth, quality (SEC point-in-time store)
    sentiment: 0.35    # local-LLM news TONE only (events live in the catalyst pillar)
    learned: 0.0       # ML ranking pillar (src/ml). SHIPPED DARK: raise only after
                       # `python -m scripts.train_ranker` reports every kill criterion PASSED.
                       # Any value > 0 bumps score_version to 4 automatically.
    catalyst: 0.0      # 9-key catalyst vector from the local LLM. SHIPPED DARK, and
                       # un-backtestable by construction (no news archive exists), so
                       # it can only be earned forward: raise it when `pillar_ic`
                       # reports |t| >= 2 for the catalyst pillar.
  learned:
    enabled: true      # compute + persist the pillar when a trained model exists (even at weight 0)
    force: false       # weight the pillar even if the kill criteria did not pass (don't)
  # Peer-group shrinkage. A within-group percentile is blended with the wider rank at
  # weight n/(n+k), n = names in the group with that metric. k=10 reproduces the old
  # flat 50/50 exactly at n=10; a 3-name group now carries 23% instead of 50%.
  group_shrinkage_k: 10
  # Minimum inputs a fundamental subscore needs before it means anything. Below it the
  # subscore is NaN (not a fabricated 0.5), the name is tagged `thin-data` and the
  # fundamental pillar drops out of ITS composite, re-weighted over the rest.
  min_fundamental_components: 2
  quality:
    require_positive_fcf_for_tag: true
    subweights:        # each subscore normalized 0..1 across the universe
      valuation: 0.30  # PE, fwd PE, P/FCF, PEG, EV/EBITDA — ranked WITHIN sector only
      cashflow: 0.30   # FCF yield, FCF growth
      growth: 0.20     # revenue & EPS growth
      quality: 0.20    # margins, ROE/ROIC, low debt
  catalyst:
    # EQUAL ON PURPOSE. The deal score this replaces gave 35% to a static per-sector
    # prior that could never be wrong and never be measured; hand-tuning these nine
    # would repeat that mistake. Change them only on measured evidence.
    # `adverse_event` is subtracted, not added — it is the negative axis.
    subweights:
      customer_deal: 1.0
      ma_event: 1.0
      guidance_revision: 1.0
      analyst_action: 1.0
      product_cycle: 1.0
      regulatory_policy: 1.0
      capital_return_insider: 1.0
      management_ownership: 1.0
      adverse_event: 1.0
  tags:
    quality_threshold: 0.60
    higher_risk:
      flag_if_unprofitable: true
      valuation_pct_floor: 0.15  # in the most expensive 15% of its OWN sector
      sector_pe_multiple: 2.5    # or PE > this x the sector's median PE
      # `pe_risk_ceiling` (a flat 60x) was deprecated in Phase 4 and is REMOVED here.
      # It was a sector bet dressed as a risk rule and it kept flagging EQIX/DLR
      # higher-risk at 67x/92x P/E when their P/FFO is ~20x. The two rules above are
      # its sector-aware replacement. "PE is N/A" gets the neutral `no-earnings` tag.

news:
  # SEC EDGAR fair-access wants a contact address in the request User-Agent.
  # Prefer SEC_CONTACT_EMAIL in .env (git-ignored) — this file IS committed, so an
  # address left here becomes public the moment the repo does.
  sec_contact: ""

local_llm:
  enabled: true
  model: qwen3.5:9b
  think: false                   # qwen3.5 is a reasoning model; disable <think> for fast clean JSON
  host: http://localhost:11434
  timeout_seconds: 120

# Technical-analysis data sources.
technical:
  benchmark: SPY        # pick-snapshot benchmark (recorded alongside picks for grading)
  rs_benchmark: SMH     # relative-strength peer benchmark ("leadership" = beating the theme)

llm:
  # claude_cli   = headless `claude -p` on your Claude Code SUBSCRIPTION (default; the only
  #                provider with --resume sessions and file/shell tools for Investigate mode)
  # anthropic_api = official SDK with ANTHROPIC_API_KEY (bring your own key, per-token billing)
  provider: claude_cli

claude:
  # Runs on the Claude Code subscription via CLAUDE_CODE_OAUTH_TOKEN.
  # IMPORTANT: ANTHROPIC_API_KEY must be UNSET or it switches to per-token billing.
  model: claude-opus-4-8
  force_subscription: true       # strip ANTHROPIC_API_KEY from the subprocess env
  allowed_tools: "WebSearch,WebFetch"
  timeout_seconds: 600           # per-call timeout (subprocess is tree-killed on expiry)
  chat_timeout_seconds: 240      # dashboard chat: quick-mode per-question timeout
  chat_investigate_timeout_seconds: 900  # investigate mode (agentic, reads code+DB)
  deep_run_budget_seconds: 5400  # overall wall-clock cap for the finalist loop (90 min; 0 = no cap)
  max_finalists: 10              # hard cap on Claude calls per deep run
  red_team: true                 # devil's-advocate pass on buy-rated finalists (extra call each)

ibkr:
  enabled: true
  host: 127.0.0.1
  port: 4001                     # IB Gateway live=4001 (via IBC); TWS live=7496, paper=7497
  client_id: 17
  connect_timeout: 8
  # HARD wall-clock for a whole broker call (connect + handshake + positions + quotes).
  # connect_timeout only bounds one connect attempt and ib_async can sit inside the
  # handshake forever when the Gateway's port is open but its session has lapsed (the
  # nightly-restart / 2FA state). That hung two Phase 7 runs with no health record
  # written at all. On expiry the run records `broker degraded` and continues.
  total_timeout: 45
  positions_wait: 3.0            # minimum wait (s) for per-account position bursts
  positions_quiet: 3.0           # stop once no new position rows arrive for this long
  positions_max_wait: 25.0       # hard cap; a cold Gateway can take ~8s to send the first row
  market_data_type: 3            # 1=realtime (needs paid API data), 3=delayed (free), 4=delayed-frozen

schedule:
  # Run times live in the Windows scheduled tasks (scripts/setup_windows_tasks.ps1
  # -DeepTime/-LightTime), in the machine's local time. Suggested: deep ~07:00 ET
  # (US pre-market), light ~16:15 ET (just after the close) — convert to your timezone.
  skip_when_market_closed: true  # skip weekends + NYSE holidays (run_daily checks before running)
